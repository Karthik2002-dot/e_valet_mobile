name: Flutter CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev
  # push:
  #   branches:
  #     - main-andriod

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - uses: actions/setup-java@v1
        with:
          java-version: '12.x'

      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: flutter pub get

  validate_commit_message:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # Fetch all history needed to check all commits in the PR

      - name: Validate commit messages
        run: |
          regex='^(fix|feat|docs|style|refactor|test|chore): .{1,}$'
          git log origin/${{ github.event.pull_request.base.ref }}..HEAD --pretty=format:%s | while IFS= read -r msg; do
            echo "Checking: $msg"
            if ! [[ $msg =~ $regex ]]; then
              echo "Invalid commit message: $msg"
              exit_code=1
            fi
          done

          if [ $exit_code -eq 1 ]; then
            echo "::error::One or more commit messages do not follow the required format."
            exit 1
          fi

  code_quality:
    needs: validate_commit_message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos

  code_format:
    needs: validate_commit_message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .

